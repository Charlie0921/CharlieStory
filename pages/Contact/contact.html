<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact | Kunjoong Kim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../../img/favicon.jpg" />
    <link rel="stylesheet" href="./contact.css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav>
        <div class="left">
          <a id="title" href="../../index.html"> KUNJOONG KIM</a>
        </div>
        <div class="right">
          <a href="../../index.html">
            <i class="fa-solid fa-diagram-project"></i>
            <span>MY WORK</span>
          </a>
          <a href="../AboutMe/aboutme.html">
            <i class="fa-solid fa-question"></i>
            <span>ABOUT ME</span>
          </a>
          <a href="../Contact/contact.html">
            <i class="fa-solid fa-address-book"></i>
            <span>CONTACT</span>
          </a>
        </div>
      </nav>
    </header>

    <main>
      <!-- CONTACT SECTION -->
      <section class="contact" id="contact">
        <h1 class="title">Let's Get in Touch</h1>
        <p class="subtitle">
          Have a project in mind or want to collaborate? <br />
          I'd love to hear from you!
        </p>

        <div class="contact-container">
          <!-- Contact Image -->
          <div class="contact-image">
            <img src="../../img/phone.png" alt="Contact illustration" />
          </div>

          <!-- Contact Form -->
          <div class="contact-form-wrapper">
            <form
              class="contact-form"
              action="https://formspree.io/f/YOUR_FORM_ID"
              method="POST"
            >
              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="Tell me about your project or just say hi!"
                  required
                ></textarea>
              </div>

              <button type="submit" class="submit-button">Send Message</button>
            </form>
          </div>
        </div>

        <!-- Contact Info Cards -->
        <div class="contact-info">
          <div class="info-card">
            <i class="fa-solid fa-envelope"></i>
            <div class="info-card-content">
              <span class="info-card-label">Email</span>
              <a href="mailto:kunmiddle02@gmail.com" class="info-card-value">
                kunmiddle02@gmail.com
              </a>
            </div>
          </div>

          <div class="info-card">
            <i class="fa-solid fa-location-dot"></i>
            <div class="info-card-content">
              <span class="info-card-label">Location</span>
              <span class="info-card-value">Pennsylvania, USA</span>
            </div>
          </div>

          <div class="info-card">
            <i class="fa-solid fa-graduation-cap"></i>
            <div class="info-card-content">
              <span class="info-card-label">Education</span>
              <span class="info-card-value">Penn State, Computer Science</span>
            </div>
          </div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
          <a
            href="https://github.com/Charlie0921"
            target="_blank"
            class="social-link"
            aria-label="GitHub"
          >
            <i class="fa-brands fa-github"></i>
          </a>
          <a
            href="https://linkedin.com/in/kunjoong-kim"
            target="_blank"
            class="social-link"
            aria-label="LinkedIn"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a
            href="https://blog.naver.com/PostList.naver?blogId=kunmiddle&from=postList&categoryNo=8"
            target="_blank"
            class="social-link"
            aria-label="Blog"
          >
            <i class="fa-solid fa-book"></i>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
