<html>
  <head>
    <meta charset="uft-8" />

    <link rel="icon" type="image/x-icon" href="../../img/favicon.jpg" />
    <link rel="stylesheet" href="./contact.css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script
      src="https://kit.fontawesome.com/7a70d5c651.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav>
        <div class="left">
          <a id="title" href="../../index.html">
            <img src="../../img/favicon.jpg" height="40px" /> KUNJOONG KIM</a
          >
        </div>
        <div class="right">
          <a href="../../index.html">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
          </a>
          <a href="../AboutMe/aboutme.html">
            <i class="fa-solid fa-question"></i>
            <span>ABOUT ME</span>
          </a>
          <a href="../Project/project.html">
            <i class="fa-solid fa-diagram-project"></i>
            <span>PROJECTS</span>
          </a>
          <a href="../Contact/contact.html">
            <i class="fa-solid fa-address-book"></i>
            <span>CONTACT</span>
          </a>
        </div>
      </nav>
    </header>

    <main>
      <!-- SECTION 4: Contact -->
      <section class="contact" id="contact">
        <div class="title"><strong>Let's Get in Touch</strong></div>
        <div class="contact-container">
          <img src="../../img/phone.png" />
          <form
            action="mailto:kunmiddle02@gmail.com"
            method="post"
            enctype="text/plain"
          >
            <div style="display: flex; flex-direction: column; gap: 10px">
              <label>Name:</label>
              <input
                type="text"
                name="Your name"
                placeholder="Enter your name here"
              />
              <label>Email:</label>
              <input
                type="email"
                name="Your email"
                placeholder="Enter your email here"
              />
              <label>Message:</label>
              <textarea
                name="Your message"
                cols="50"
                rows="10"
                placeholder="Enter your message"
              ></textarea>
              <input class="submit_button" type="submit" />
            </div>
          </form>
        </div>
      </section>
    </main>
    <script>
      const tabs = document.querySelectorAll(".tab-button");
      const all_content = document.querySelectorAll(
        ".content-wrapper .content"
      );

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => {
          tabs.forEach((tab) => {
            tab.classList.remove("active");
          });
          tab.classList.add("active");

          all_content.forEach((content) => {
            content.classList.remove("active");
          });
          all_content[index].classList.add("active");
        });
        console.log(index);
      });
    </script>
  </body>
</html>
