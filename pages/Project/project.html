<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kunjoong's website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="./img/favicon.jpg" />
    <link rel="stylesheet" href="./project.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Red+Hat+Display&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://kit.fontawesome.com/7a70d5c651.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <nav>
    <div>
      <a id="title" href="../../index.html">Kunjoong Kim</a>
    </div>
    <div class="right">
      <a href="../../index.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="../Project/project.html">
        <i class="fa-solid fa-child"></i>
        <span>Projects</span>
      </a>
      <a href="../AboutMe/aboutme.html">
        <i class="fa-solid fa-question"></i>
        <span>About Me</span>
      </a>
      <a href="../Contact/contact.html">
        <i class="fa-solid fa-address-book"></i>
        <span>Contact</span>
      </a>
    </div>
  </nav>

  <body>
    <div class="project-container">
      <!-- LEFT FIXED PANEL -->
      <section class="intro-section">
        <div class="fade-in">
          <h2>
            My <span class="bold">JOURNEY</span> as a
            <span class="bold">DEVELOPER</span>
          </h2>
          <p>Want to work with me together?</p>
          <a href="../Contact/contact.html" class="contact-btn">Contact Me!</a>
        </div>
      </section>

      <!-- RIGHT SCROLLABLE PANEL -->
      <section class="cards-section">
        <div class="project-page-wrapper">
          <project-grid id="project-grid-component"></project-grid>
          <div id="status" style="margin-top: 12px; font-size: 0.95rem"></div>
        </div>
      </section>
    </div>

    <script type="module">
      import "./components/ProjectGrid/ProjectGrid.js";
      import "./components/ProjectModal/ProjectModal.js";
      import { fetchProjects, fetchProjectById } from "./api.js";

      const statusEl = document.getElementById("status");
      const gridEl = document.getElementById("project-grid-component");

      async function init() {
        try {
          statusEl.textContent = "Loading projects...";
          const projects = await fetchProjects();

          if (!projects || projects.length === 0) {
            statusEl.textContent = "No projects found.";
          } else {
            statusEl.textContent = "";
          }

          gridEl.data = projects;
          console.log("Projects loaded from Supabase:", projects);
        } catch (err) {
          console.error(err);
          statusEl.textContent =
            "Failed to load projects. Please try again later.";
        }
      }

      document.addEventListener("open-modal", async (e) => {
        try {
          const idRaw = e?.detail?.id;
          const projectId = Number(idRaw);

          if (!Number.isFinite(projectId)) {
            console.warn("Invalid project id:", idRaw);
            return;
          }

          const project = await fetchProjectById(projectId);
          if (!project) {
            alert("Project not found.");
            return;
          }

          const modal = document.createElement("project-modal");
          modal.data = project;
          document.body.appendChild(modal);
        } catch (err) {
          console.error("open-modal error:", err);
          alert("Failed to load project detail.");
        }
      });

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
