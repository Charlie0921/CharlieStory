      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="

  <nav>
    <div>
      <a id="title" href="../../index.html">Kunjoong Kim</a>
    </div>
    <div class="right">
      <a href="../../index.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="../Project/project.html">
        <i class="fa-solid fa-child"></i>
        <span>Projects</span>
      </a>
      <a href="../AboutMe/aboutme.html">

    </div>
  </nav>
  <body>
    <div class="project-page-wrapper">
      <div class="project-title-text">
        <h1>My Projects</h1>
      </div>
      <project-grid id="project-grid-component"></project-grid>
    </div>

    <script type="module">
      import "./components/ProjectGrid/ProjectGrid.js";
      import "./components/ProjectModal/ProjectModal.js";
      import { projectsData } from "./projectsData.js";

      document.addEventListener("DOMContentLoaded", () => {
        const wrapper = document.getElementById("project-grid-component");
        wrapper.data = projectsData;

        document.addEventListener("open-modal", (e) => {
          console.log(e.detail);
          const projectId = parseInt(e.detail.id, 10);
          const project = projectsData.find((p) => p.id === projectId);
          const modal = document.createElement("project-modal");
          console.log(project, modal);
          modal.data = project;
          document.body.appendChild(modal);
        });
      });
    </script>
  </body>
